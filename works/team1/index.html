<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <title>二人協力しないと出られない部屋からの脱出</title>
  <meta name="description" content="二人で別々の画面を見て、情報を共有しながら挑む協力型の謎解きゲームです。">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="team1.css">
  <script src="../../analytics.js"></script>

<body>
  <main id="titlePage" class="container">
    <a class="home-banner" href="../../" aria-label="なぞねぎ脱出のホームへ">
      <img src="../../favicon.ico" alt="">
      <span>なぞねぎ脱出</span>
    </a>

    <section class="card hero-card">
      <img src="images/title.svg" alt="二人協力しないと出られない部屋からの脱出">
    </section>

    <section class="card team-intro">
      <h1>二人協力しないと出られない部屋からの脱出</h1>
      <p>二人はそれぞれ別の画面を見ながら、見つけた情報を声に出して共有してください。<br>一人だけでは解けない謎を、二人の力で解き明かしましょう。</p>

      <h2>遊び方</h2>
      <ol>
        <li>二人で「なぞねぎ」と「なぞなす」の担当を決めます。</li>
        <li>それぞれの端末で、担当するキャラクターの入口を選びます。</li>
        <li>お互いの画面は見せず、会話で情報を共有して進めます。</li>
      </ol>

      <p class="role-guide">担当するキャラクターを選んでください</p>
      <div class="role-select">
        <a class="role-card role-a" href="sideA.html" aria-label="なぞねぎとしてゲームを始める">
          <img src="images/start-negi.svg" alt="なぞねぎとしてゲームを始める">
        </a>
        <a class="role-card role-b" href="sideB.html" aria-label="なぞなすとしてゲームを始める">
          <img src="images/start-nasu.svg" alt="なぞなすとしてゲームを始める">
        </a>
      </div>
    </section>
  </main>
