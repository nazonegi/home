<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <title>なぞねぎ側｜協力しないと出られない部屋からの脱出</title>
  <meta name="description" content="二人で別々の画面を見て、情報を共有しながら挑む協力型のブラウザ謎解きゲームです。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="協力しないと出られない部屋からの脱出｜なぞねぎ脱出">
  <meta property="og:description" content="二人で別々の画面を見て、情報を共有しながら挑む協力型のブラウザ謎解きゲームです。">
  <meta property="og:url" content="https://nazonegi.github.io/home/works/team1/">
  <meta property="og:image" content="https://nazonegi.github.io/home/works/team1/images/title.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="協力しないと出られない部屋からの脱出｜なぞねぎ脱出">
  <meta name="twitter:description" content="二人で別々の画面を見て、情報を共有しながら挑む協力型のブラウザ謎解きゲームです。">
  <meta name="twitter:image" content="https://nazonegi.github.io/home/works/team1/images/title.png">
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="team1.css">
  <script src="../../analytics.js"></script>
</head>
<body class="side-page side-a">
  <main class="container game team-game">
    <header class="side-header">
      <a href="index.html">← タイトルに戻る</a>
      <span>TEAM 1 / SIDE A</span>
    </header>

    <section id="question1" class="card q1-card game-question">
      <div class="question-header">
        <h1 class="qlabel">Q1</h1>
        <button id="noticeButton" class="notice-link" type="button">気づく</button>
      </div>

      <p class="q1-instruction">絵をもじに反映して、
      </p>

      <div id="letterGrid" class="letter-grid" aria-label="ひらがなのマス"></div>

      <div id="imageLane" class="image-lane" aria-label="右から左へ流れる4つの画像">
        <img data-runner="A" alt="たぬき">
        <img data-runner="B" alt="9">
        <img data-runner="C" alt="ドレス">
        <img data-runner="D" alt="ナイフ">
        <button id="laneFullscreenClose" class="lane-fullscreen-close" type="button" aria-label="拡大表示を閉じる">×</button>
      </div>
      <button id="laneFullscreenButton" class="lane-fullscreen-button" type="button">拡大</button>
      <p id="q1SubmittedAnswer" class="submitted hidden"></p>
    </section>

    <section id="question2" class="card q2-card game-question hidden">
      <div class="question-header">
        <h1 class="qlabel">Q2</h1>
        <button id="q2NoticeButton" class="notice-link" type="button">気づく</button>
      </div>

      <div class="coop-maze-layout">
        <div>
          <button class="zoom-image-button" type="button" aria-label="なぞなすの迷路を拡大">
            <img class="partner-maze-image zoomable-image" src="images/sideA/q2-nasu-maze.png" alt="なぞなすの迷路">
          </button>
        </div>

        <div>
          <div class="maze-controller" aria-label="なぞねぎの迷路操作">
            <button type="button" data-move="up" aria-label="上へ進む"><span class="direction-triangle" aria-hidden="true"></span></button>
            <button type="button" data-move="left" aria-label="左へ進む"><span class="direction-triangle" aria-hidden="true"></span></button>
            <img class="controller-player" src="images/sideA/negi-player-marker.png" alt="">
            <button type="button" data-move="right" aria-label="右へ進む"><span class="direction-triangle" aria-hidden="true"></span></button>
            <button type="button" data-move="down" aria-label="下へ進む"><span class="direction-triangle" aria-hidden="true"></span></button>
          </div>
        </div>
      </div>

      <div class="route-guide" aria-label="Sから4つの画像を通ってG">
        <button class="route-node" type="button" aria-label="Sの画像を拡大"><img class="zoomable-image" src="images/sideA/q2-route-start.png" alt="S"></button>
        <button class="route-node" type="button" aria-label="経路画像1を拡大"><img class="zoomable-image" src="images/sideA/q2-route-1.png" alt="経路画像1"></button>
        <button class="route-node" type="button" aria-label="経路画像2を拡大"><img class="zoomable-image" src="images/sideA/q2-route-2.png" alt="経路画像2"></button>
        <button class="route-node" type="button" aria-label="経路画像3を拡大"><img class="zoomable-image" src="images/sideA/q2-route-3.png" alt="経路画像3"></button>
        <button class="route-node" type="button" aria-label="経路画像4を拡大"><img class="zoomable-image" src="images/sideA/q2-route-4.png" alt="経路画像4"></button>
        <button class="route-node" type="button" aria-label="Gの画像を拡大"><img class="zoomable-image" src="images/sideA/q2-route-goal.png" alt="G"></button>
      </div>
      <div id="routeText" class="route-text" aria-live="polite" aria-label="経路で得たひらがな"></div>
      <div class="q2-actions">
        <button id="mazeResetButton" type="button">リセット</button>
      </div>
      <p id="mazeMessage" class="ng" aria-live="polite"></p>
      <p id="q2SubmittedAnswer" class="submitted hidden"></p>
    </section>

    <section id="questionLast" class="card last-card game-question hidden">
      <div class="question-header">
        <h1 class="qlabel">LAST</h1>
        <button id="lastNoticeButton" class="notice-link" type="button">気づく</button>
      </div>

      <div id="zodiacStage" class="zodiac-stage" aria-label="動き回る十二支の動物"></div>
      <div class="round-timer">
        <progress id="roundProgress" max="300" value="300"></progress>
        <span id="roundTimeText">残り 5:00</span>
      </div>

      <div class="kana-key" aria-label="数字とひらがなの対応">
        <div class="kana-pair"><span>1</span><span>か</span></div>
        <div class="kana-pair"><span>2</span><span>い</span></div>
        <div class="kana-pair"><span>3</span><span>う</span></div>
        <div class="kana-pair"><span>4</span><span>み</span></div>
        <div class="kana-pair"><span>5</span><span>こ</span></div>
        <div class="kana-pair"><span>6</span><span>と</span></div>
        <div class="kana-pair"><span>7</span><span>き</span></div>
        <div class="kana-pair"><span>8</span><span>は</span></div>
        <div class="kana-pair"><span>9</span><span>ま</span></div>
        <div class="kana-pair"><span>10</span><span>し</span></div>
        <div class="kana-pair"><span>11</span><span>た</span></div>
        <div class="kana-pair"><span>12</span><span>え</span></div>
      </div>

      <div id="lastTargets" class="last-targets" aria-label="数える動物"></div>
      <p id="lastSubmittedAnswer" class="submitted hidden"></p>
    </section>

    <nav class="pager team-pager" aria-label="問題の切り替え">
      <button id="prevQuestionButton" type="button" aria-label="前の問題">◀</button>
      <div id="questionSteps">
        <button class="dot current" type="button" data-question="0" aria-label="Q1"></button>
        <button class="dot" type="button" data-question="1" aria-label="Q2" disabled></button>
        <button class="dot" type="button" data-question="2" aria-label="LAST" disabled></button>
      </div>
      <button id="nextQuestionButton" type="button" aria-label="次の問題" disabled>▶</button>
    </nav>

    <section id="q1AnswerCard" class="card answer">
      <h2>こたえ</h2>
      <div class="answerrow">
        <input id="answerInput" autocomplete="off" placeholder="答えを入力" aria-label="答え">
        <button id="answerButton" type="button">決定</button>
      </div>
      <p id="wrongMessage" class="ng" aria-live="polite"></p>
      <div class="resetarea"><button class="progress-reset-button resetlink" type="button">進捗リセット</button></div>
    </section>

    <section id="q2AnswerCard" class="card answer hidden">
      <h2>こたえ</h2>
      <div class="answerrow">
        <input id="q2AnswerInput" autocomplete="off" placeholder="答えを入力" aria-label="Q2の答え">
        <button id="q2AnswerButton" type="button">決定</button>
      </div>
      <p id="q2WrongMessage" class="ng" aria-live="polite"></p>
      <div class="resetarea"><button class="progress-reset-button resetlink" type="button">進捗リセット</button></div>
    </section>

    <section id="lastAnswerCard" class="card answer hidden">
      <h2>こたえ</h2>
      <div class="answerrow">
        <input id="lastAnswerInput" autocomplete="off" placeholder="答えを入力" aria-label="LASTの答え">
        <button id="lastAnswerButton" type="button">決定</button>
      </div>
      <p id="lastWrongMessage" class="ng" aria-live="polite"></p>
      <div class="resetarea"><button class="progress-reset-button resetlink" type="button">進捗リセット</button></div>
    </section>
  </main>

  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modalbox">
      <button id="modalClose" class="close" type="button" aria-label="閉じる">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <div id="viewer" class="overlay viewer hidden" role="dialog" aria-modal="true" aria-label="画像の拡大表示">
    <button id="viewerClose" class="close" type="button" aria-label="閉じる">×</button>
    <img id="viewerImage" alt="">
  </div>
  <script src="team1-last-algorithm.js"></script>
  <script src="team1-sidea.js"></script>
</body>
</html>
